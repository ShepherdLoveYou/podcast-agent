# 节目信息，生成 feed.xml 时使用

title = "思考者 ThINKer"
author = "JING"
language = "zh-cn"
description = "欢迎来到 思考者 ThINKer 播客。这是一档拒绝技术神话、专注硬核推演的播客。我们不聊科技媒体的早报噪音，只做一件事：用商业逻辑的第一性原理，拆解AI浪潮与投资本质。拒绝碎片化的情绪炒作, 让我们剥离噪音，深度思考。"
