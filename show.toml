# 节目风格。每期生成时都会放在"着重说明"的最前面，交给 NotebookLM
house_style = """
【节目风格，每期都要遵守】
听众：大众，没有专业背景。少用术语，必须用的术语用一句话解释。

说话方式：两位主持人是在聊自己了解和思考过的话题，全程用自己的口吻讲述。不要让听众察觉内容另有出处：不要出现"资料、来源、素材、文档、文章、报告、讲座、作者、原文、文字记录"这些词，不要说"根据……""……中提到""我们今天拿到的……"。

展开方式：
1. 开场 30 秒内用一个生活里的具体场景，或一个人人都遇到过的困惑切入，并点明这一期只回答哪一个问题、它和听众有什么关系。不要用"欢迎来到深度解析"这类套话开场。
2. 循循善诱：一位主持人站在普通听众的位置，问出听众此刻最想问的问题；另一位不直接给结论，而是用例子、类比和反问一步步把人带到结论。从熟悉的事讲到陌生的事。
3. 先讲故事再讲道理：每个抽象观点之前，先给一个具体的人、场景或生活里的例子；数字要换成听众有感觉的说法。
4. 分三到四个段落层层推进，中间有一次转折或反常识的发现；每进入新段落用一句话承上启下，让只用耳朵听的人不迷路。
5. 口语化，句子短，一句话只讲一个意思。
6. 结尾用两三句话回顾要点，给听众一件今天就能做的小事，并呼应开场的那个场景。
"""

